<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Policyjna baza prawa — przegląd</title><style>

</style></head><body><header class="head"><div class="hi"><div class="row"><div class="brand">Policyjna baza prawa</div><div class="small">wersja po audycie</div></div><div class="search"><input id="q" autocomplete="off" placeholder="Szukaj: art. 15, kontrola osobista…"><button id="clr" class="xbtn">×</button></div><div id="results" class="results"></div></div></header><main class="wrap"><div id="picker" class="picker"></div><div id="view"></div></main><div id="ret" class="return"><button>← Wróć do odwołania</button></div><script src="chunk-0.js"></script><script src="chunk-1.js"></script><script src="chunk-2.js"></script><script src="chunk-3.js"></script><script>const B64=(window.__POLICE_B64||[]).join("");let DATA,act,origin=null,idMap={};const q=document.getElementById('q'),res=document.getElementById('results'),view=document.getElementById('view'),picker=document.getElementById('picker'),ret=document.getElementById('ret');function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}async function unzip(){const b=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');DATA=JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(ds)).text());DATA.forEach(A=>A[3].forEach(R=>{idMap[R[0]]=A[0];R[4].forEach(U=>{if(U[0])idMap[U[0]]=A[0]})}))}function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function children(prefix,type){const R=act[3].find(x=>prefix.startsWith(x[0]));if(!R)return[];return R[4].filter(u=>u[1]===type&&u[0].startsWith(prefix)).map(u=>[u[0],u[2].replace(/^(ust\.|pkt|lit\.)\s*/,'')])}function rangeLinks(prefix,type,a,b){let xs=children(prefix,type);const num=x=>{let m=x.match(/^(\d+)([a-z]*)$/i);return m?[+m[1],m[2]||'']:[999,x]};let A=num(a),B=num(b);return xs.filter(x=>{let n=num(x[1]);return n[0]>=A[0]&&n[0]<=B[0]})}function nav(xs){if(!xs.length)return'';return '<span class="navrefs">'+xs.map(x=>`<a href="#${x[0]}">${esc(x[1])}</a>`).join('')+'</span>'}function linkify(text,aid){let t=esc(text);const ids=new Set(Object.keys(idMap));t=t.replace(/ust\.\s*(\d+[a-z]?)\s+pkt\s+(\d+[a-z]?)(?![–-])/gi,(m,u,p)=>{let id=`${aid}-ust-${u}-pkt-${p}`;return ids.has(id)?`<a class="simple" href="#${id}">${m}</a>`:m});t=t.replace(/pkt\s+(\d+[a-z]?)\s*[–-]\s*(\d+[a-z]?)/gi,(m,a,b)=>{let base=aid;let xs=rangeLinks(base+'-', 'p',a,b);return m+nav(xs)});t=t.replace(/ust\.\s*(\d+[a-z]?)(?!\s+pkt)(?!\s*[–-])/gi,(m,n)=>{let id=`${aid}-ust-${n}`;return ids.has(id)?`ust. <a class="simple" href="#${id}">${n}</a>`:m});t=t.replace(/art\.\s*(\d+[a-z]?)/gi,(m,n)=>{let pref=aid.split('-art-')[0],id=`${pref}-art-${n}`;return ids.has(id)?`art. <a class="simple" href="#${id}">${n}</a>`:m});return t}function render(code,target){act=DATA.find(x=>x[0]===code)||DATA[0];picker.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===act[0]));let h=`<a class="source" target="_blank" rel="noopener" href="${act[2]}">Oficjalne źródło ↗</a><div class="toc"><h3>${esc(act[1])}</h3><div class="toclinks">`;act[3].forEach(r=>h+=`<a href="#${r[0]}">${esc(r[2])} · ${esc(r[3]).slice(0,55)}</a>`);h+='</div></div>';act[3].forEach(r=>{let whole=r[5]==='1';h+=`<article class="article${whole?' wholefuture':''}" id="${r[0]}"><div class="ah"><div class="sec">${esc(r[1])}</div><div class="anum">${esc(r[2])}</div><div class="topic">${esc(r[3])}</div></div>`;if(whole)h+=`<details class="future" open=""><summary>Zmiana przyszła — obowiązuje od ${esc(r[6])}</summary><div class="fc">Treść poniżej nie obowiązuje jeszcze.</div></details>`;h+='<div class="body">';r[4].forEach(u=>h+=`<div class="unit ${u[1]}"${u[0]?` id="${u[0]}"`:''}>${u[2]?`<span class="marker">${esc(u[2])}</span>`:''}<div class="txt">${linkify(u[3],r[0])}</div></div>`);h+='</div>';r[7].forEach(f=>h+=`<details class="future"><summary>${esc(f[0])}</summary><div class="fc">${esc(f[1])}</div></details>`);h+='</article>'});view.innerHTML=h;bind();history.replaceState(null,'',target?'#'+target:'#act-'+act[0]);if(target)setTimeout(()=>jump(target,false),30);else scrollTo(0,0)}function bind(){view.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.getAttribute('href').slice(1),ta=idMap[id]||act[0];const src=a.closest('.unit')||a.closest('.article');if(!origin&&(a.classList.contains('simple')||a.closest('.navrefs'))){origin={act:act[0],id:src?.id,y:scrollY};ret.classList.add('show')}if(ta!==act[0])render(ta,id);else jump(id,true)})}function jump(id,smooth){let el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'});el.classList.add('target');setTimeout(()=>el.classList.remove('target'),850)}ret.querySelector('button').onclick=()=>{if(!origin)return;let o=origin;origin=null;ret.classList.remove('show');if(o.act!==act[0])render(o.act,o.id);setTimeout(()=>{let e=o.id&&document.getElementById(o.id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{e.classList.add('return-origin');setTimeout(()=>e.classList.remove('return-origin'),2600)},350)}else scrollTo({top:o.y,behavior:'smooth'})},o.act!==act[0]?80:0)};let timer;q.oninput=()=>{clearTimeout(timer);timer=setTimeout(search,1000)};document.getElementById('clr').onclick=()=>{q.value='';res.classList.remove('show')};function search(){let s=norm(q.value.trim());if(s.length<2){res.classList.remove('show');return}let ts=s.split(/\s+/),rows=[];DATA.forEach(A=>A[3].forEach(R=>{let text=norm(R[2]+' '+R[3]+' '+R[4].map(u=>u[3]).join(' '));if(ts.every(t=>text.includes(t)))rows.push([A[0],R])}));res.innerHTML=rows.slice(0,30).map(x=>`<a class="sr" href="#${x[1][0]}" data-a="${x[0]}"><b>${esc(x[1][2])} · ${esc(x[1][3])}</b><small>${esc(x[1][4].map(u=>u[3]).join(' ').slice(0,180))}…</small></a>`).join('')||'<div class="sr">Brak wyników</div>';res.classList.add('show');res.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();res.classList.remove('show');render(a.dataset.a,a.getAttribute('href').slice(1))})}(async()=>{await unzip();DATA.forEach(A=>{let b=document.createElement('button');b.className='actbtn';b.dataset.c=A[0];b.textContent=A[1];b.onclick=()=>render(A[0]);picker.appendChild(b)});let hash=decodeURIComponent(location.hash.slice(1)),code=idMap[hash]||(hash.startsWith('act-')?hash.slice(4):DATA[0][0]);render(code,idMap[hash]?hash:null)})();</script></body></html>
