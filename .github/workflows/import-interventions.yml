name: Import intervention laws

on:
  push:
    branches:
      - feat/offline-search-packs-v1
    paths:
      - tools/interventions-sources.json
      - tools/import-interventions.py
      - .github/workflows/import-interventions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-search-packs-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Import current legal text
        run: python tools/import-interventions.py
      - name: Build and validate offline database
        run: |
          node tools/build-law-packs.mjs
          node tools/test-offline-packs.mjs
          node tools/test-offline-runtime.mjs
          node tools/benchmark-law-packs.mjs
      - name: Commit imported laws
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js reports/interventions-import.json
          if git diff --cached --quiet; then
            echo "Intervention laws are current."
          else
            git commit -m "Import intervention law pack"
            git push origin HEAD:feat/offline-search-packs-v1
          fi
